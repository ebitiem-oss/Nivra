<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nivra - لابی بازی</title>
    <style>
        :root { 
            --bg-color: #121212; 
            --card-bg: #1e1e1e; 
            --primary-blue: #2980b9; 
            --text-gray: #888; 
            --accent-color: #27ae60; 
            --danger-color: #e74c3c; 
            --warning-color: #f39c12; 
        }
        body { background-color: var(--bg-color); color: #ffffff; font-family: Tahoma, sans-serif; margin: 0; padding: 0; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background-color: var(--card-bg); border-bottom: 1px solid #333; }
        .back-btn { background: none; border: 1px solid #444; color: white; padding: 8px 15px; border-radius: 8px; cursor: pointer; text-decoration: none; font-size: 14px; }
        .container { max-width: 500px; margin: 0 auto; padding: 20px; }
        .section { background-color: var(--card-bg); border-radius: 15px; padding: 20px; border: 1px solid #333; margin-bottom: 20px; }
        .section-title { font-size: 14px; color: var(--text-gray); margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 8px; }
        
        /* دکمه دایره‌ای شناور (FAB) */
        .fab-create-room {
            position: fixed;
            bottom: 30px;
            left: 30px;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background-color: var(--accent-color);
            color: white;
            border: none;
            font-size: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            cursor: pointer;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }
        .fab-create-room:hover { transform: scale(1.1); }

        .btn { display: block; width: 100%; background-color: var(--primary-blue); color: white; border: none; padding: 12px; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; text-align: center; margin-bottom: 10px; transition: 0.2s; }
        .btn-danger { background-color: var(--danger-color); }
        
        .room-item { display: flex; justify-content: space-between; align-items: center; background: #262626; padding: 12px 15px; border-radius: 10px; border: 1px solid #333; margin-bottom: 10px; }
        .room-info { display: flex; flex-direction: column; gap: 4px; }
        .room-name { font-weight: bold; font-size: 15px; }
        .room-meta { font-size: 12px; color: var(--text-gray); }
        .join-btn { background-color: var(--primary-blue); color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        
        .player-slot { display: flex; align-items: center; justify-content: space-between; background: #262626; padding: 12px; border-radius: 10px; margin-bottom: 10px; border: 1px solid #333; }
        .player-info { display: flex; align-items: center; gap: 10px; }
        .player-avatar { width: 35px; height: 35px; border-radius: 50%; background: #444; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .player-name { font-weight: bold; font-size: 14px; }
        .player-status { font-size: 12px; padding: 4px 8px; border-radius: 6px; }
        .status-ready { background-color: rgba(39, 174, 96, 0.2); color: var(--accent-color); }
        .status-waiting { background-color: rgba(243, 156, 18, 0.2); color: var(--warning-color); }
        .status-host { background-color: rgba(41, 128, 185, 0.2); color: var(--primary-blue); }

        .voice-controls { display: flex; gap: 10px; margin-top: 15px; margin-bottom: 15px; }
        .ptt-btn { flex: 2; background-color: #34495e; color: white; border: none; padding: 12px; border-radius: 10px; font-weight: bold; cursor: pointer; text-align: center; transition: 0.2s; }
        .ptt-btn.active { background-color: var(--danger-color); transform: scale(0.98); }
        .mic-toggle { flex: 1; background-color: #2c3e50; border: 1px solid #444; color: white; border-radius: 10px; cursor: pointer; font-size: 18px; }
        
        .no-rooms { text-align: center; color: var(--text-gray); padding: 20px 0; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <header class="header">
        <a href="index.html" class="back-btn">⬅️ خروج</a>
        <div id="lobby-title-text" style="font-weight: bold; font-size: 18px;">لابی</div>
        <div style="width: 50px;"></div>
    </header>

    <div class="container">
        <!-- دکمه شناور (FAB) -->
        <button class="fab-create-room" onclick="createNewRoom()">+</button>

        <!-- فاز ۱: مرورگر اتاق‌ها -->
        <div id="lobby-browser-view">
            <div class="section">
                <div class="section-title">اتاق‌های در حال انتظار</div>
                <div class="room-list" id="rooms-list-container"></div>
            </div>
        </div>

        <!-- فاز ۲: نمای داخل اتاق -->
        <div id="room-active-view" class="hidden">
            <div class="section">
                <div id="room-display-name" style="margin-bottom:15px; font-weight:bold; font-size: 18px; color: var(--primary-blue);">اتاق</div>
                <div class="section-title">بازیکنان</div>
                <div id="players-list-container"></div>

                <div class="voice-controls">
                    <button id="mic-toggle-btn" class="mic-toggle" onclick="toggleMic()">🎙️</button>
                    <button id="ptt-btn" class="ptt-btn" onmousedown="startPTT()" onmouseup="stopPTT()" ontouchstart="startPTT()" ontouchend="stopPTT()">🎤 PTT</button>
                </div>
            </div>
            
            <button id="ready-btn" class="btn" onclick="toggleReadyStatus()">🙋 اعلام آمادگی</button>
            <button id="start-game-btn" class="btn btn-success hidden" onclick="startGame()">🚀 شروع بازی</button>
            <button class="btn btn-danger" onclick="leaveCurrentRoom()">🚪 خروج</button>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const gameType = urlParams.get('game') || 'uno';
        const maxPlayers = parseInt(urlParams.get('p')) || 4;
        
        const gameNames = {'uno': 'اونو', 'mench': 'منچ', 'hokm': 'حکم', 'shelem': 'شلم', 'billiard': 'بیلیارد', 'football': 'فوتبال دستی', 'othello': 'اتللو'};
        document.getElementById('lobby-title-text').innerText = `لابی ${gameNames[gameType] || gameType}`;

        const mockRooms = [
            { id: 101, name: "اتاق حرفه‌ای‌ها 🔥", host: "کامیار", playersCount: 3, maxPlayers: maxPlayers },
            { id: 102, name: "بازی دوستانه", host: "سارا_۹۹", playersCount: 1, maxPlayers: maxPlayers },
            { id: 103, name: "فقط با میکروفون 🎙️", host: "آرش_آریایی", playersCount: 2, maxPlayers: maxPlayers }
        ];

        let currentRoom = null, isHost = false, isReady = false, isMicOn = false, players = [], botInterval = null;

        function renderRoomList() {
            const container = document.getElementById('rooms-list-container');
            container.innerHTML = '';
            mockRooms.forEach(room => {
                const roomEl = document.createElement('div');
                roomEl.className = 'room-item';
                roomEl.innerHTML = `<div class="room-info"><span class="room-name">${room.name}</span><span class="room-meta">سازنده: ${room.host}</span></div><button class="join-btn" onclick="joinRoom(${room.id})">ورود</button>`;
                container.appendChild(roomEl);
            });
        }

        function createNewRoom() {
            isHost = true; isReady = true; 
            currentRoom = { name: "اتاق شما (سازنده)", maxPlayers: maxPlayers };
            players = [{ name: "شما (سازنده)", avatar: "👑", isHost: true, isReady: true }];
            showActiveRoomView();
            simulateBotsJoining();
        }

        function joinRoom(roomId) {
            isHost = false; isReady = false;
            const targetRoom = mockRooms.find(r => r.id === roomId);
            currentRoom = { name: targetRoom.name, maxPlayers: targetRoom.maxPlayers };
            players = [{ name: targetRoom.host, avatar: "👤", isHost: true, isReady: true }];
            for(let i = 1; i < targetRoom.playersCount; i++) players.push({ name: `بازیکن ${i}`, avatar: "🤖", isHost: false, isReady: Math.random() > 0.5 });
            players.push({ name: "شما", avatar: "👤", isHost: false, isReady: false });
            showActiveRoomView();
        }

        function showActiveRoomView() {
            document.getElementById('lobby-browser-view').classList.add('hidden');
            document.querySelector('.fab-create-room').classList.add('hidden');
            document.getElementById('room-active-view').classList.remove('hidden');
            document.getElementById('room-display-name').innerText = currentRoom.name;
            if (isHost) { document.getElementById('ready-btn').classList.add('hidden'); document.getElementById('start-game-btn').classList.remove('hidden'); }
            else { document.getElementById('ready-btn').classList.remove('hidden'); document.getElementById('start-game-btn').classList.add('hidden'); }
            renderPlayers();
        }

        function renderPlayers() {
            const container = document.getElementById('players-list-container');
            container.innerHTML = '';
            players.forEach(p => {
                const playerEl = document.createElement('div');
                playerEl.className = 'player-slot';
                playerEl.innerHTML = `<div class="player-info"><div class="player-avatar">${p.avatar}</div><span class="player-name">${p.name}</span></div><span class="player-status ${p.isHost ? 'status-host' : (p.isReady ? 'status-ready' : 'status-waiting')}">${p.isHost ? 'میزبان' : (p.isReady ? 'آماده' : 'در انتظار')}</span>`;
                container.appendChild(playerEl);
            });
        }

        function simulateBotsJoining() {
            botInterval = setInterval(() => {
                if (players.length < maxPlayers) {
                    players.push({ name: "بات", avatar: "🤖", isHost: false, isReady: true });
                    renderPlayers();
                } else clearInterval(botInterval);
            }, 3000);
        }

        function leaveCurrentRoom() {
            clearInterval(botInterval);
            document.getElementById('room-active-view').classList.add('hidden');
            document.querySelector('.fab-create-room').classList.remove('hidden');
            document.getElementById('lobby-browser-view').classList.remove('hidden');
            renderRoomList();
        }

        function toggleReadyStatus() {
            isReady = !isReady;
            players[players.length-1].isReady = isReady;
            renderPlayers();
            document.getElementById('ready-btn').innerText = isReady ? "🙋 لغو آمادگی" : "🙋 اعلام آمادگی";
        }

        function startPTT() { document.getElementById('ptt-btn').classList.add('active'); }
        function stopPTT() { document.getElementById('ptt-btn').classList.remove('active'); }
        function toggleMic() { isMicOn = !isMicOn; document.getElementById('mic-toggle-btn').style.backgroundColor = isMicOn ? 'var(--accent-color)' : '#2c3e50'; }
        function startGame() { alert("بازی شروع شد!"); }

        renderRoomList();
    </script>
</body>
</html>

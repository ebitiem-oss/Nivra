<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --bg: #121212;
            --surface: #1e1e1e;
            --text: #ffffff;
            --accent: #6c5ce7;
            --gray: #a0a0a0;
        }

        body { margin: 0; background-color: var(--bg); color: var(--text); font-family: sans-serif; }

        /* --- نمای لیست اتاق‌ها (Telegram Style) --- */
        #lobby-view { padding: 10px; }
        .room-row {
            display: flex; align-items: center; padding: 15px; border-bottom: 1px solid #333; cursor: pointer;
        }
        .room-row:hover { background: #252525; }
        .avatar { width: 50px; height: 50px; background: #444; border-radius: 50%; margin-left: 15px; }
        .room-info h3 { margin: 0; font-size: 16px; }
        .room-info p { margin: 5px 0 0; color: var(--gray); font-size: 13px; }

        /* --- نمای داخل اتاق (Game Active) --- */
        #room-view { display: none; height: 100vh; flex-direction: column; }
        .header { padding: 15px; background: var(--surface); display: flex; justify-content: space-between; }
        .game-area { flex-grow: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 20px; }
        .slot { background: #2a2a2a; border-radius: 12px; padding: 15px; text-align: center; position: relative; }
        .mic-icon { color: #00ff88; font-size: 12px; margin-top: 5px; }
        .chat-area { height: 200px; background: #1a1a1a; padding: 10px; border-top: 1px solid #333; }

        /* دکمه + */
        .fab { position: fixed; bottom: 30px; left: 30px; background: var(--accent); width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- لابی -->
<div id="lobby-view">
    <h2 style="padding: 10px;">اتاق‌های در دسترس</h2>

    <!-- اتاق ۱: اونو -->
    <div class="room-row" onclick="enterRoom('اتاقِ دوستان', 'اونو')">
        <div class="avatar"></div>
        <div class="room-info">
            <h3>اتاقِ دوستان</h3>
            <p>بازی: اونو | ۲ نفر داخل</p>
        </div>
    </div>

    <!-- اتاق ۲: منچ -->
    <div class="room-row" onclick="enterRoom('اتاقِ مهدی', 'منچ')">
        <div class="avatar"></div>
        <div class="room-info">
            <h3>اتاقِ مهدی</h3>
            <p>بازی: منچ | ۴ نفر داخل</p>
        </div>
    </div>

    <!-- اتاق ۳: دوز -->
    <div class="room-row" onclick="enterRoom('اتاقِ شماره ۳', 'دوز')">
        <div class="avatar"></div>
        <div class="room-info">
            <h3>اتاقِ شماره ۳</h3>
            <p>بازی: دوز | ۱ نفر داخل</p>
        </div>
    </div>
    
        <!-- دکمه ساخت اتاق -->
        <div class="fab" onclick="createRoom()">+</div>
    </div>

    <!-- اتاق بازی -->
    <div id="room-view">
        <div class="header">
            <button onclick="exitRoom()">🔙 بازگشت</button>
            <span>اتاق فعال</span>
        </div>
        <div class="game-area">
            <div class="slot">کاربر ۱ <div class="mic-icon">🎙️</div></div>
            <div class="slot">خالی</div>
            <div class="slot">کاربر ۲</div>
            <div class="slot">خالی</div>
        </div>
        <div class="chat-area">چت عمومی...</div>
    </div>

    <script>
        function enterRoom(name) {
            document.getElementById('lobby-view').style.display = 'none';
            document.getElementById('room-view').style.display = 'flex';
        }

        function createRoom() {
            // منطق ساخت اتاق
            alert("اتاق جدید ساخته شد!");
            enterRoom();
        }

        function exitRoom() {
            document.getElementById('lobby-view').style.display = 'block';
            document.getElementById('room-view').style.display = 'none';
        }
    </script>
</body>
</html>

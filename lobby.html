<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nivra - Minimal Lobby</title>
    <style>
        :root { 
            --bg-color: #0f0f0f; /* سیاه عمیق */
            --card-bg: #1a1a1a; /* خاکستری بسیار تیره */
            --accent: #ffffff; /* سفید برای کنتراست بالا */
            --text-main: #e0e0e0;
            --text-dim: #666;
            --status-ready: #00ff88;
            --status-waiting: #ffaa00;
        }

        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            height: 100vh;
        }

        /* Header بسیار ساده */
        .header { 
            padding: 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            border-bottom: 1px solid #222;
        }
        .back-btn { color: var(--text-dim); text-decoration: none; font-size: 14px; }

        .container { flex: 1; padding: 20px; max-width: 500px; margin: 0 auto; width: 100%; box-sizing: border-box; }

        /* استایل مینیمال اتاق‌ها */
        .room-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.2s;
        }
        .room-card:active { transform: scale(0.98); }
        
        .room-info-simple { display: flex; flex-direction: column; }
        .room-title { font-weight: 500; font-size: 15px; }
        .room-meta-simple { font-size: 12px; color: var(--text-dim); margin-top: 4px; }

        .join-minimal { 
            background: var(--accent); 
            color: black; 
            border: none; 
            padding: 6px 16px; 
            border-radius: 20px; 
            font-size: 13px; 
            font-weight: bold; 
            cursor: pointer;
        }

        /* دکمه شناور بسیار ساده */
        .fab-minimal {
            position: fixed;
            bottom: 30px;
            left: 30px;
            width: 56px;
            height: 56px;
            background: var(--accent);
            color: black;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            border: none;
            cursor: pointer;
        }

        /* بخش داخل اتاق - بازیکنان بسیار ساده */
        .player-row {
            display: flex;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #222;
        }
        .simple-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            margin-left: 12px;
            border: 1px solid #444;
        }
        .player-name-simple { font-size: 15px; flex: 1; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; }
        .dot-ready { background: var(--status-ready); box-shadow: 0 0 8px var(--status-ready); }
        .dot-waiting { background: var(--status-waiting); }

        /* دکمه‌های عملیاتی پایین صفحه */
        .action-bar {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .btn-action {
            padding: 15px;
            border-radius: 12px;
            border: none;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }
        .btn-primary { background: var(--accent); color: black; }
        .btn-outline { background: transparent; color: var(--text-dim); border: 1px solid #333; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header class="header">
        <a href="#" class="back-btn">← بازگشت</a>
        <span id="title" style="font-size: 16px; letter-spacing: 1px;">LOBBY</span>
        <div style="width: 40px;"></div>
    </header>

    <div class="container">
        <!-- نمای لابی -->
        <div id="lobby-view">
            <div id="rooms-container">
                <!-- اتاق‌ها اینجا رندر می‌شوند -->
            </div>
            <button class="fab-minimal" onclick="createRoom()">+</button>
        </div>

        <!-- نمای داخل اتاق -->
        <div id="room-view" class="hidden">
            <div style="margin-bottom: 30px;">
                <div id="room-name-display" style="font-size: 20px; font-weight: bold;">Room Name</div>
                <div style="color: var(--text-dim); font-size: 12px;">Players in session</div>
            </div>

            <div id="players-container">
                <!-- بازیکنان اینجا رندر می‌شوند -->
            </div>

            <div class="action-bar">
                <button id="ready-btn" class="btn-action btn-primary" onclick="toggleReady()">آماده شدن</button>
                <button id="start-btn" class="btn-action btn-primary hidden" onclick="alert('Start!')">شروع بازی</button>
                <button class="btn-action btn-outline" onclick="exitRoom()">خروج</button>
            </div>
        </div>
    </div>

    <script>
        // دیتای ساده (بدون نام کاربری‌های پیچیده یا پروفایل)
        const mockRooms = [
            { id: 1, name: "Room 1", count: "2/4" },
            { id: 2, name: "Room 2", count: "1/4" }
        ];

        const mockPlayers = [
            { name: "You", avatar: "👤", ready: true, isHost: true },
            { name: "Player 1", avatar: "👤", ready: false, isHost: false }
        ];

        function renderLobby() {
            const container = document.getElementById('rooms-container');
            container.innerHTML = mockRooms.map(r => `
                <div class="room-card">
                    <div class="room-info-simple">
                        <span class="room-title">${r.name}</span>
                        <span class="room-meta-simple">${r.count} players</span>
                    </div>
                    <button class="join-minimal" onclick="joinRoom()">Join</button>
                </div>
            `).join('');
        }

        function renderPlayers() {
            const container = document.getElementById('players-container');
            container.innerHTML = mockPlayers.map(p => `
                <div class="player-row">
                    <div class="simple-avatar">${p.avatar}</div>
                    <div class="player-name-simple">${p.name}</div>
                    <div class="status-dot ${p.ready ? 'dot-ready' : 'dot-waiting'}"></div>
                </div>
            `).join('');
        }

        function createRoom() {
            document.getElementById('lobby-view').classList.add('hidden');
            document.getElementById('room-view').classList.remove('hidden');
            document.getElementById('room-name-display').innerText = "New Room";
            document.getElementById('start-btn').classList.remove('hidden'); // چون میزبان هستیم
            document.getElementById('ready-btn').classList.add('hidden');
            renderPlayers();
        }

        function joinRoom() {
            document.getElementById('lobby-view').classList.add('hidden');
            document.getElementById('room-view').classList.remove('hidden');
            document.getElementById('room-name-display').innerText = "Room 1";
            renderPlayers();
        }

        function exitRoom() {
            document.getElementById('room-view').classList.add('hidden');
            document.getElementById('lobby-view').classList.remove('hidden');
            renderLobby();
        }

        function toggleReady() {
            mockPlayers[1].ready = !mockPlayers[1].ready;
            renderPlayers();
        }

        // شروع
        renderLobby();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nivra - Main Menu</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --primary-blue: #2980b9;
            --text-gray: #888;
            --accent-color: #27ae60;
        }

        body {
            background-color: var(--bg-color);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* --- هدر --- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background-color: var(--card-bg);
            border-bottom: 1px solid #333;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo-section { font-size: 20px; font-weight: bold; }

        .profile-section {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        #avatar-preview {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid var(--accent-color);
            object-fit: cover;
        }

        .user-info { font-size: 13px; color: #fff; }

        /* منوی سه نقطه */
        .menu-container { position: relative; }
        .dots-btn { background: none; border: none; color: white; font-size: 24px; cursor: pointer; padding: 0 5px; }
        .dropdown-menu {
            display: none;
            position: absolute;
            left: 0;
            top: 35px;
            background: var(--card-bg);
            min-width: 180px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            z-index: 1001;
            border: 1px solid #333;
        }
        .dropdown-menu a { display: block; padding: 12px 15px; color: white; text-decoration: none; font-size: 14px; border-bottom: 1px solid #2a2a2a; }
        .dropdown-menu a:hover { background: #2c3e50; }
        .show { display: block; }

        /* لیست بازی‌ها */
        .games-container { display: flex; flex-direction: column; gap: 15px; padding: 20px; max-width: 500px; margin: 0 auto; }
        .game-card { background-color: var(--card-bg); height: 80px; border-radius: 15px; display: flex; align-items: center; justify-content: center; gap: 12px; text-decoration: none; color: white; font-size: 18px; border: 1px solid #333; cursor: pointer; transition: 0.2s; }
        .game-card:hover { background-color: #262626; }
        .game-icon { font-size: 26px; }

        .dropdown-game { position: relative; }
        .dropdown-content { display: none; position: absolute; bottom: calc(100% + 5px); left: 0; right: 0; background: #2c3e50; border-radius: 10px; z-index: 10; box-shadow: 0 4px 10px rgba(0,0,0,0.4); }
        .dropdown-content a { display: block; padding: 12px; text-align: center; color: white; text-decoration: none; border-bottom: 1px solid #3e5871; }
        .dropdown-game:focus-within .dropdown-content { display: block; }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo-section">🎮 Nivra</div>
        
        <div class="profile-section" onclick="document.getElementById('avatar-file').click()">
            <img id="avatar-preview" src="https://api.dicebear.com/7.x/bottts/svg?seed=Nivra" alt="Avatar">
            <span class="user-info" id="player-name">ID: 1234</span>
            <input type="file" id="avatar-file" accept="image/*" style="display: none;" onchange="changeAvatar(event)">
        </div>

        <div class="menu-container">
            <button class="dots-btn" onclick="toggleMenu()">⋮</button>
            <div id="dropdownMenu" class="dropdown-menu">
                <a href="#">👥 لیست دوستان</a>
                <a href="#">💎 خرید اشتراک</a>
                <a href="#">⚙️ تنظیمات</a>
                <a href="#" style="color: #e74c3c;">🚪 خروج</a>
            </div>
        </div>
    </header>

    <main class="games-container">
        <a href="lobby.html?game=uno" class="game-card"><span>اونو</span> <span class="game-icon">🎴</span></a>
        <a href="lobby.html?game=mench" class="game-card"><span>منچ</span> <span class="game-icon">🎲</span></a>
        
        <div class="dropdown-game" tabindex="0">
            <div class="game-card"><span>حکم</span> <span class="game-icon">♠️</span></div>
            <div class="dropdown-content">
                <a href="lobby.html?game=hokm&p=2">۲ نفره</a>
                <a href="lobby.html?game=hokm&p=4">۴ نفره</a>
            </div>
        </div>
        <div class="dropdown-game" tabindex="0">
            <div class="game-card"><span>شلم</span> <span class="game-icon">🃏</span></div>
            <div class="dropdown-content">
                <a href="lobby.html?game=shalam&p=2">۲ نفره</a>
                <a href="lobby.html?game=shalam&p=4">۴ نفره</a>
            </div>
        </div>
        <div class="dropdown-game" tabindex="0">
            <div class="game-card"><span>بیلیارد</span> <span class="game-icon">🎱</span></div>
            <div class="dropdown-content">
                <a href="lobby.html?game=billiard&p=2">۲ نفره</a>
                <a href="lobby.html?game=billiard&p=4">۴ نفره</a>
            </div>
        </div>
        <div class="dropdown-game" tabindex="0">
            <div class="game-card"><span>فوتبال</span> <span class="game-icon">⚽️</span></div>
            <div class="dropdown-content">
                <a href="lobby.html?game=football&p=2">۲ نفره</a>
                <a href="lobby.html?game=football&p=4">۴ نفره</a>
            </div>
        </div>
        <a href="lobby.html?game=otello" class="game-card"><span>اتللو</span> <span class="game-icon">🧠</span></a>
    </main>

    <script>
        function changeAvatar(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) { document.getElementById('avatar-preview').src = e.target.result; }
                reader.readAsDataURL(file);
            }
        }
        function toggleMenu() { document.getElementById("dropdownMenu").classList.toggle("show"); }
        window.onclick = function(event) {
            if (!event.target.matches('.dots-btn')) {
                var dropdowns = document.getElementsByClassName("dropdown-menu");
                for (var i = 0; i < dropdowns.length; i++) {
                    dropdowns[i].classList.remove('show');
                }
            }
        }
    </script>
</body>
</html>
}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Nivra - پلتفرم بازی</title>
</head>
<body>

    <!-- لابی -->
    <div id="lobby-view">
        <h2 style="padding: 10px; color: white;">اتاق‌های در دسترس</h2>
        <div class="room-row" onclick="enterRoom('اتاقِ دوستان', 'اونو')">
            <div class="avatar"></div>
            <div class="room-info">
                <h3>اتاقِ دوستان</h3>
                <p>بازی: اونو | ۲ نفر داخل</p>
            </div>
        </div>
        <div class="fab" onclick="createRoom()">+</div>
    </div>

    <!-- اتاق بازی -->
    <div id="room-view" style="display: none;">
        <header>
            <button onclick="exitRoom()">← خروج</button>
            <span id="room-title">اتاق بازی</span>
            <button>⚙️</button>
        </header>

        <div class="game-board">
            <div class="player-slot">
                <div class="avatar"></div>
                <span>شما</span>
                <div class="mic-status">🎙️</div>
            </div>
            <div class="player-slot inactive">
                <div class="avatar"></div>
                <span>خالی</span>
            </div>
        </div>

        <footer>
            <input type="text" placeholder="پیام بده...">
            <button id="mic-btn" onmousedown="startTalk()" onmouseup="stopTalk()" ontouchstart="startTalk()" ontouchend="stopTalk()">🎙️</button>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>

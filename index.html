<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Nivra - Game</title>
    <style>
        body {
            background: radial-gradient(circle, #1a0b2e 0%, #050505 100%);
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            border: 2px solid #0ff;
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 0 20px #0ff, inset 0 0 20px #0ff;
            background: rgba(0, 0, 0, 0.5);
        }
        /* افکت چشمک‌زن برای Nivra */
        h1 {
            font-size: 3rem;
            color: #fff;
            text-shadow: 0 0 10px #f0f, 0 0 20px #f0f;
            animation: blink 1.5s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        /* استایل دکمه که اکنون لینک شده است */
        .btn-link {
            text-decoration: none;
        }
        button {
            background: transparent;
            border: 2px solid #f0f;
            color: #f0f;
            padding: 15px 30px;
            font-size: 1.2rem;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.3s;
        }
        button:hover {
            background: #f0f;
            color: #fff;
            box-shadow: 0 0 20px #f0f;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Nivra</h1>
        <p>به دنیای بازی نیورا خوش آمدید</p>
        
        <!-- این بخش تغییر کرده است -->
        <a href="games.html" class="btn-link">
            <button>شروع بازی ها</button>
        </a>
        
    </div>
</body>
</html>

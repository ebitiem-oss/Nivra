<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nivra | دنیای بازی</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- هدر سایت -->
    <header>
        <div class="header-content">
            <div class="logo">NIVRA</div>
            <div class="menu-icon">⋮</div>
        </div>
    </header>

    <!-- بخش اصلی محتوا -->
    <main id="main-container">
        
        <!-- صفحه اصلی (لیست بازی‌ها) -->
        <section id="tab-home" class="tab-content">
            <h2 class="section-title">انتخاب بازی</h2>
            <div class="games-list">
                <!-- بازی‌ها توسط JavaScript اینجا ساخته می‌شوند -->
            </div>
        </section>

        <!-- صفحه لابی -->
        <section id="tab-lobby" class="tab-content" style="display: none;">
            <h2 id="lobby-title" class="section-title">لابی</h2>
            <div id="rooms-list">
                <!-- اتاق‌ها اینجا نمایش داده می‌شوند -->
            </div>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
